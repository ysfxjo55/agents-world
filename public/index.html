<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12121c">
<title>Agent World</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <div id="scrim"></div>
  <aside id="side">
    <header>
      <h1>Agent World</h1>
      <div id="live" title="Live connection"><span></span><b>connecting</b></div>
    </header>
    <div id="counts"></div>
    <div id="list"></div>
    <footer>
      <label class="check"><input type="checkbox" id="showAll"> Show old (&gt;14d) &amp; archived</label>
    </footer>
  </aside>
  <main id="stage">
    <div id="world"></div>
    <div id="toolbar">
      <a id="chatBtn" href="/chat.html" title="Chat with your agents">Chat</a>
      <button id="themeBtn" title="Switch world"></button>
      <select id="timeSel" title="Lighting follows your computer clock; override here">
        <option value="auto">Local time</option><option value="9">Morning</option><option value="13">Noon</option><option value="17.6">Sunset</option><option value="23">Night</option>
      </select>
      <button id="homeBtn" title="Frame everything">⌂ Overview</button>
      <button id="sideBtn" title="Sessions list">☰</button>
      <button id="focusBtn" title="Hide / show the interface">⤢</button>
    </div>
    <div id="empty" hidden>No sessions in the last 14 days. Start an agent and it will appear here.</div>
    <div id="card" hidden></div>
    <section id="chatpanel" hidden>
      <header><span id="cpTitle"></span><a id="cpFull" target="_blank" rel="noopener" title="Open in the full chat page">↗</a><button id="cpClose" aria-label="Close">×</button></header>
      <iframe id="cpFrame" title="Chat" allow="clipboard-write"></iframe>
    </section>
    <div id="toast" hidden></div>
  </main>
</div>
<script type="module" src="main.js"></script>
<script type="module" src="daily-today.js"></script>
</body>
</html>
