# Runs the checks (lint, typecheck, tests) on Windows, macOS and Linux for every push and pull request,
# so problems like Windows line endings are caught before anyone downloads a new version.
name: check
on: [push, pull_request]
permissions:
  contents: read
concurrency:                                  # a newer push cancels the older run of the same branch
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
